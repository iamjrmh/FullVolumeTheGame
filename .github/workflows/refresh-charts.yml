name: Refresh chart index

# Re-sweeps both catalogues and commits the result. Netlify builds on push, so
# committing is the deploy.
#
# 08:00 UTC on Sundays, which is 4am Eastern while daylight saving is on and
# 3am once it ends - GitHub's cron has no notion of timezones, so one of the
# two has to drift. Nobody is downloading charts at either hour.
on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      refresh_cover_map:
        description: "Re-sweep Chorus for album covers as well (adds ~8 min)"
        type: boolean
        default: false

permissions:
  contents: write

# A sweep takes tens of minutes. If one is somehow still going, let it finish
# rather than racing a second one into the same files.
concurrency:
  group: refresh-charts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Both caches live outside docs/ and are gitignored, so without this every
      # run would rebuild the 77k-song Chorus cover map and re-ask Deezer about
      # 18k songs it already knows. With it, a weekly run only looks up what is
      # actually new. A miss costs time, not correctness.
      - name: Restore the cover lookup caches
        uses: actions/cache@v4
        with:
          path: |
            tools/cover-map.json
            tools/deezer-cache.json
          key: chart-covers-${{ github.run_id }}
          restore-keys: chart-covers-

      - name: Count what is there now
        run: |
          python - <<'PY' > /tmp/before.json
          import json, pathlib
          out = {}
          for name in ("vocals", "rb3"):
              p = pathlib.Path("docs/data") / f"{name}.js"
              if p.exists():
                  text = p.read_text(encoding="utf-8")
                  start = text.index("{", text.index("window."))
                  out[name] = len(json.loads(text[start:text.rindex("}") + 1])["rows"])
              else:
                  out[name] = 0
          print(json.dumps(out))
          PY
          cat /tmp/before.json

      - name: Sweep Chorus Encore for vocal charts
        run: python tools/collect-vocals.py

      - name: Sweep Rhythmverse for Rock Band customs
        run: python tools/collect-rb3.py

      - name: Fill in album covers
        run: |
          if [ "${{ inputs.refresh_cover_map }}" = "true" ]; then
            python tools/fill-covers.py --refresh
          else
            python tools/fill-covers.py
          fi

      # An unattended job must not be able to quietly replace a full index with
      # a partial one. Either catalogue having lost more than a tenth of its
      # rows means a sweep was cut short, not that the scene shrank overnight.
      - name: Refuse a sweep that came back short
        run: |
          python - <<'PY'
          import json, pathlib, sys
          before = json.loads(pathlib.Path("/tmp/before.json").read_text())
          bad = False
          for name, was in before.items():
              text = (pathlib.Path("docs/data") / f"{name}.js").read_text(encoding="utf-8")
              start = text.index("{", text.index("window."))
              now = len(json.loads(text[start:text.rindex("}") + 1])["rows"])
              change = now - was
              print(f"{name}: {was:,} -> {now:,} ({change:+,})")
              if was and now < was * 0.9:
                  print(f"  {name} lost more than 10% of its rows - not committing")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Commit and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No new charts this week - nothing to deploy."
            exit 0
          fi
          git commit -m "chore: weekly chart refresh

          Swept Chorus Encore and Rhythmverse for vocal charts, and filled in
          any covers the new rows needed. Generated by .github/workflows/refresh-charts.yml."
          git push
