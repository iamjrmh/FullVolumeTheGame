name: Bake the changelog

# /changelog/ is live on its own: the page asks /api/releases, which reads
# GitHub each time its ten-minute cache lapses. This is the other half, which
# keeps the copy committed in docs/changelog/releases.js current too - the one the
# page paints first, and the one it has when the function or GitHub is down.
#
# A published release is the trigger that matters. "edited" catches notes
# corrected after the fact, and the nightly run catches anything else. Netlify
# builds on push, so committing is the deploy.

on:
  release:
    types: [published, edited, released]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-changelog
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Exits non-zero if GitHub cannot be reached: a silent no-op here would
      # leave the baked copy quietly behind the live one.
      - name: Read the release notes into the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/bake-changelog.mjs

      - name: Commit and deploy
        run: |
          if [ -z "$(git status --porcelain docs/changelog/releases.js)" ]; then
            echo "Baked changelog already matches the releases, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog/releases.js
          git commit -m "chore: bake changelog from the GitHub releases

          Ran by .github/workflows/bake-changelog.yml. The release notes on
          GitHub are the source of truth; this is the copy /changelog/ paints
          before /api/releases has answered."
          git push
